{{- if site.Params.passwordProtect.enabled -}}
<div id="password-screen" style="
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: #fff;
  z-index: 10000;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
">
  <div style="text-align: center; padding: 2rem;">
    <div style="display: flex; flex-direction: column; gap: 1.5rem; max-width: 280px; margin: 0 auto;">
      <input
        type="password"
        id="pwd-input"
        placeholder="{{ site.Params.passwordProtect.placeholder | default "密码" }}"
        style="
          padding: 0.5rem 0;
          border: none;
          border-bottom: 1px solid #999;
          font-size: 1rem;
          text-align: center;
          letter-spacing: 0.2em;
          outline: none;
          background: transparent;
        "
        autocomplete="off"
      >
      <button
        id="pwd-btn"
        style="
          padding: 0.5rem 0;
          background: transparent;
          color: #333;
          border: none;
          border-bottom: 1px solid transparent;
          font-size: 0.9rem;
          cursor: pointer;
          letter-spacing: 0.1em;
          transition: border-color 0.2s;
          width: fit-content;
          margin: 0 auto;
        "
      >
        {{ site.Params.passwordProtect.buttonText | default "ENTER" }}
      </button>
      <div id="pwd-error" style="color: #c00; font-size: 0.85rem; min-height: 1.2rem;"></div>
    </div>
  </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
  var STORAGE_KEY = 'bridget_auth_token';
  var CORRECT_PASSWORD = '{{ site.Params.passwordProtect.password | default "123456" }}';

  var passwordScreen = document.getElementById('password-screen');
  var mainContent = document.getElementById('main');
  var input = document.getElementById('pwd-input');
  var button = document.getElementById('pwd-btn');
  var error = document.getElementById('pwd-error');

  // Check if already authenticated
  var token = sessionStorage.getItem(STORAGE_KEY);
  if (token === 'authenticated') {
    passwordScreen.style.display = 'none';
    return;
  }

  // Hide main content until authenticated
  mainContent.style.display = 'none';

  function verify() {
    var password = input.value.trim();
    if (!password) {
      error.textContent = '{{ site.Params.passwordProtect.emptyError | default "Please enter password" }}';
      return;
    }

    button.disabled = true;
    button.textContent = '{{ site.Params.passwordProtect.verifyingText | default "VERIFYING..." }}';
    error.textContent = '';

    // Simple delay for UX
    setTimeout(function() {
      if (password === CORRECT_PASSWORD) {
        sessionStorage.setItem(STORAGE_KEY, 'authenticated');
        passwordScreen.style.display = 'none';
        mainContent.style.display = 'block';
      } else {
        error.textContent = '{{ site.Params.passwordProtect.wrongError | default "Incorrect password" }}';
        button.disabled = false;
        button.textContent = '{{ site.Params.passwordProtect.buttonText | default "ENTER" }}';
        input.value = '';
        input.focus();
      }
    }, 300);
  }

  button.onclick = verify;
  input.onkeypress = function(e) {
    if (e.key === 'Enter' || e.keyCode === 13) verify();
  };

  // Show button underline when input has value
  input.oninput = function() {
    if (input.value.trim()) {
      button.style.borderBottomColor = '#333';
    } else {
      button.style.borderBottomColor = 'transparent';
    }
  };

  input.focus();
});
</script>
{{- end -}}
